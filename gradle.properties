org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# NeoForge for 1.20.1 is the legacy fork of Forge 47.1 (net.neoforged:forge),
# so Loom builds it as the Forge platform (SRG at runtime, MinecraftForge APIs).
loom.platform=forge

# Mod Properties
mod.version=3.8.3
mod.group=dev.rossxrio
mod.id=do_a_barrel_roll
mod.name=Do a Barrel Roll

# Minecraft / NeoForge 1.20.1
mod.mc_version=1.20.1
mod.mc_dep=[1.20.1]
deps.yarn=1.20.1+build.10
deps.neoforge=47.1.106
deps.neoforge_dep=[47.1,)
deps.yacl=3.6.6+1.20.1-forge
deps.mixinextras=0.4.1
