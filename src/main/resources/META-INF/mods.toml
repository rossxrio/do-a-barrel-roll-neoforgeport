modLoader = "javafml"
loaderVersion = "[47,)"
license = "GPL-3.0"

issueTrackerURL = "https://github.com/rossxrio/do-a-barrel-roll-neoforgeport/issues"

[[mods]]
modId = "do_a_barrel_roll"
version = "${version}"
displayName = "Do a Barrel Roll"
displayURL = "https://modrinth.com/mod/do-a-barrel-roll"
authors = "rossxrio (NeoForge port), enjarai (original author)"
credits = "Originally based on Cool Elytra Roll by Jorbon, originally ported to Forge by MehVahdJukaar, mod icon by Mizeno"
description = '''
Microsoft flight simulator for Minecraft elytras.
'''
logoFile = "assets/do_a_barrel_roll/icon.png"
# Optional on both sides: vanilla clients can join servers running the mod and vice versa.
displayTest = "IGNORE_ALL_VERSION"

# NeoForge 1.20.1 still identifies itself as "forge" (it is the legacy 47.1.x fork).
[[dependencies.do_a_barrel_roll]]
modId = "forge"
mandatory = true
versionRange = "${neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.do_a_barrel_roll]]
modId = "minecraft"
mandatory = true
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

[[dependencies.do_a_barrel_roll]]
modId = "yet_another_config_lib_v3"
mandatory = false
versionRange = "[3.1.0,)"
ordering = "NONE"
side = "CLIENT"
