modLoader = "javafml"
loaderVersion = "[12,)"
license = "GPL-3.0"

issueTrackerURL = "https://github.com/rossxrio/do-a-barrel-roll-neoforgeport/issues"

[[mods]]
modId = "do_a_barrel_roll"
version = "${version}"
displayName = "Do a Barrel Roll"
displayURL = "https://github.com/rossxrio/do-a-barrel-roll-neoforgeport"
authors = "rossxrio (NeoForge port), enjarai (original author)"
credits = "Originally based on Cool Elytra Roll by Jorbon, originally ported to Forge by MehVahdJukaar, mod icon by Mizeno"
description = '''
Microsoft flight simulator for Minecraft elytras.

Unofficial native NeoForge port of enjarai's Do a Barrel Roll.
'''
logoFile = "assets/do_a_barrel_roll/icon.png"

[[mixins]]
config = "do_a_barrel_roll.mixins.json"

[[dependencies.do_a_barrel_roll]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.do_a_barrel_roll]]
modId = "minecraft"
type = "required"
versionRange = "${mc}"
ordering = "NONE"
side = "BOTH"

# Optional: only needed for the in-game config screen.
[[dependencies.do_a_barrel_roll]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[3.1.0,)"
ordering = "NONE"
side = "CLIENT"
